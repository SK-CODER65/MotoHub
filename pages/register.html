<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | MotoHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="register">
    <div id="site-header"></div>
    <main class="container page-main">
        <div class="auth-wrap">
            <div class="auth-aside"><span class="eyebrow">JOIN THE COMMUNITY</span>
                <h1>Ride your way.<br><em>Gear up.</em></h1>
                <p>Create an account to save favourites and keep track of your demo orders.</p>
            </div>
            <form id="register-form" class="form-card">
                <h2>Create account</h2>
                <p class="muted">It only takes a minute.</p><label>Full name<input type="text" name="name" required
                        minlength="2" placeholder="Your name"></label><label>Email address<input type="email"
                        name="email" required placeholder="you@example.com"></label><label>Password<input
                        type="password" name="password" required minlength="4"
                        placeholder="At least 4 characters"></label><button class="btn btn-dark full"
                    type="submit">Create account →</button>
                <p class="form-note">Already have an account? <a href="login.html">Sign in</a></p>
                <p id="auth-message" class="form-message" aria-live="polite"></p>
            </form>
        </div>
    </main>
    <div id="site-footer"></div>
    <script src="../js/products.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
