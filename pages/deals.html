<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deals | MotoHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="deals">
    <div id="site-header"></div>
    <main class="container page-main">
        <div class="page-intro"><span class="eyebrow">LIMITED-TIME OFFERS</span>
            <h1>Ride more, <em>spend less.</em></h1>
            <p>Hand-picked gear at its best demo prices this week.</p>
        </div>
        <section id="deal-highlight" class="deal-highlight"></section>
        <div class="shop-toolbar">
            <div id="deals-count">Deals</div>
            <div id="deal-filters" class="chip-row"></div>
        </div>
        <div id="deal-products" class="product-grid"></div>
        <section class="perk-grid">
            <div class="perk-card"><strong>₹3,000+</strong><span>Free delivery on orders above ₹3,000</span></div>
            <div class="perk-card"><strong>7 days</strong><span>Easy demo returns on unused gear</span></div>
            <div class="perk-card"><strong>COD</strong><span>Cash on delivery available (demo)</span></div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="../js/products.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
