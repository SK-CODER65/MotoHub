<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | MotoHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="login">
    <div id="site-header"></div>
    <main class="container page-main">
        <div class="auth-wrap">
            <div class="auth-aside"><span class="eyebrow">WELCOME BACK</span>
                <h1>Your next ride<br>starts <em>here.</em></h1>
                <p>Sign in to keep your gear, wishlist and orders in one place.</p>
            </div>
            <form id="login-form" class="form-card">
                <h2>Sign in</h2>
                <p class="muted">Use your demo account details.</p><label>Email address<input type="email" name="email"
                        required placeholder="you@example.com"></label><label>Password<input type="password"
                        name="password" required minlength="4" placeholder="At least 4 characters"></label><button
                    class="btn btn-dark full" type="submit">Sign in →</button>
                <p class="form-note">New to MotoHub? <a href="register.html">Create an account</a></p>
                <p id="auth-message" class="form-message" aria-live="polite"></p>
            </form>
        </div>
    </main>
    <div id="site-footer"></div>
    <script src="../js/products.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
